<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Pay - Member Registration</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#12203a;--muted:#5b6a85;--line:#d5dcea;--brand:#0a5cff;--brand2:#0838a8;--err:#c62828;--ok:#1b8a4b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:var(--brand);color:#fff;text-align:center;padding:22px 16px}
header h1{margin:0;font-size:30px;letter-spacing:.5px;font-weight:800}
header p{margin:4px 0 0;font-size:14px;opacity:.9}
main{width:100%;max-width:420px;padding:22px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h2{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.field{position:relative}
.prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
input[type=tel],input[type=password],input[type=text]{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:9px;background:transparent;color:var(--ink)}
input.p{padding-left:48px}
input:focus-visible{outline:3px solid var(--brand);outline-offset:1px;border-color:var(--brand)}

.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:7px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.toggle:hover{background:#edf3ff;color:var(--brand)}
.toggle svg{width:20px;height:20px;display:block}
.field input[type=password],.field input[type=text]{padding-right:48px}

.msg{font-size:12.5px;color:var(--err);min-height:16px;margin-top:4px}
.terms{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--muted);font-weight:400}
.terms input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand);flex:none}
.terms a{color:var(--brand)}
button.submit{width:100%;margin-top:18px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--brand);border:0;border-radius:9px;cursor:pointer}
button.submit:hover{background:var(--brand2)}
.success{display:none;text-align:center;padding:10px 0}
.success strong{color:var(--ok);font-size:20px;display:block;margin-bottom:6px}
.foot{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.foot a{color:var(--brand)}
</style>
</head>
<body>
<header>
  <h1>Instant Pay</h1>
  <p>Member Registration</p>
</header>
<main>
  <div class="card">
    <div id="formBox">
      <h2>Create your account</h2>
      <p class="sub">Enter your mobile number and set a password to register.</p>
      <form id="f" novalidate>
        <label for="mobile">Mobile Number</label>
        <div class="field">
          <span class="prefix">+91</span>
          <input class="p" id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel-national">
        </div>
        <div class="msg" id="mErr"></div>

        <label for="pw">Create Password</label>
        <div class="field">
          <input id="pw" type="password" placeholder="At least 6 characters" autocomplete="new-password">
          <button type="button" class="toggle" id="tg1" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="msg" id="pErr"></div>

        <label for="cpw">Confirm Password</label>
        <div class="field">
          <input id="cpw" type="password" placeholder="Re-enter your password" autocomplete="new-password">
          <button type="button" class="toggle" id="tg2" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="msg" id="cErr"></div>

        <label for="invite">Invite Code <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
        <div class="field">
          <input id="invite" type="text" maxlength="20" placeholder="Enter invite code" autocomplete="off" autocapitalize="characters">
        </div>
        <div class="msg" id="iNote" style="color:var(--ok)"></div>

        <label class="terms">
          <input type="checkbox" id="tc">
          <span>I agree to the <a href="#" onclick="return false">Terms &amp; Conditions</a>.</span>
        </label>
        <div class="msg" id="tErr"></div>

        <button class="submit" type="submit">Register</button>
      </form>
    </div>
    <div class="success" id="ok">
      <strong>Registration successful!</strong>
      Welcome to Instant Pay.
    </div>
  </div>
  <div class="foot">Already have an account? <a href="instant-pay-login.html">Login</a></div>
</main>
<script>
const $ = id => document.getElementById(id);
async function hashPw(m,p){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('instantpay:'+m+':'+p));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

$('mobile').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, ''));

function toggle(btn, input){
  btn.onclick = () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.3 3.3-.7"/></svg>` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`; btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); btn.title = show ? 'Hide password' : 'Show password';
  };
}
// Invite code: keep only letters/numbers, uppercase
$('invite').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  $('iNote').textContent = '';
});

// Auto-fill from link, e.g. register.html?ref=ABC123  (also works with ?invite= , ?code= , ?referral=)
(function(){
  const q = new URLSearchParams(location.search);
  const c = q.get('ref') || q.get('invite') || q.get('code') || q.get('referral') || '';
  const DEFAULT_CODE = 'HJ886GI85'; // used when the link has no code
  const clean = (c || DEFAULT_CODE).replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 20);
  if (clean) {
    $('invite').value = clean;
    $('iNote').textContent = 'Invite code applied automatically.';
  }
})();

toggle($('tg1'), $('pw'));
toggle($('tg2'), $('cpw'));

$('f').addEventListener('submit', e => {
  e.preventDefault();
  let bad = false;
  const m = $('mobile').value, p = $('pw').value, c = $('cpw').value;

  $('mErr').textContent = /^[6-9]\d{9}$/.test(m) ? '' : (bad = true, 'Enter a valid 10-digit mobile number.');
  $('pErr').textContent = p.length >= 6 ? '' : (bad = true, 'Password must be at least 6 characters.');
  $('cErr').textContent = (c && c === p) ? '' : (bad = true, 'Passwords do not match.');
  $('tErr').textContent = $('tc').checked ? '' : (bad = true, 'Please accept the Terms & Conditions to continue.');

  if (bad) return;

  // Browser-only demo storage. Replace with a secure server API for production.
  (async()=>{
    const accounts = (()=>{try{return JSON.parse(localStorage.getItem('instantpay_accounts'))||{}}catch(e){return {}}})();
    if(accounts[m]) { $('mErr').textContent='An account with this mobile number already exists.'; return; }
    const uid='IP'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
    const createdAt=Date.now();
    // Registration reward is recorded separately; starting wallet and sell balances remain zero.
    const registrationReward=Math.floor(Math.random()*(110-68+1))+68;
    const profile={name:'Member',uid,mobile:m,level:'LV0',verified:false,balance:0,sellBalance:0,registrationReward,registrationRewardClaimed:true,wallet:'',createdAt,registeredAt:createdAt};
    accounts[m]={hash:await hashPw(m,p),inviteCode:$('invite').value,createdAt:Date.now(),profile};
    localStorage.setItem('instantpay_accounts',JSON.stringify(accounts));
    localStorage.setItem('instantpay_user',JSON.stringify(profile));
    localStorage.setItem('instantpay_session',JSON.stringify({mobile:m,t:Date.now()}));
    $('formBox').style.display = 'none';
  $('ok').style.display = 'block';
    setTimeout(() => { location.href = 'instant-pay-home.html'; }, 1500);
  })().catch(()=>{ $('tErr').textContent='Could not save this demo account in this browser.'; });
});
</script>
</body>
</html>
