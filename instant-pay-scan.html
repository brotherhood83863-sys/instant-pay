<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Instant Pay - Scan</title>
<style>html{scrollbar-gutter:stable;overflow-y:scroll}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6fb;--card:#fff;--ink:#12203a;--muted:#5b6a85;--line:#dde3ef;--brand:#0a5cff;--brand2:#0838a8}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;background:var(--bg);position:relative}
.hd{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;padding:0 12px;background:linear-gradient(180deg,#0f6bff,var(--brand));color:#fff;box-shadow:0 2px 10px rgba(10,92,255,.25)}
.hd h1{font-size:18px;font-weight:700;letter-spacing:.2px;margin:0;text-align:center}
.hd button,.hd a{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);border:0;border-radius:50%;color:#fff;cursor:pointer;text-decoration:none;padding:0;transition:background .15s}
.hd button:active,.hd a:active{background:rgba(255,255,255,.3)}
.hd svg{width:20px;height:20px;display:block}
.hd .bk{justify-self:start}.pill{justify-self:end;display:flex;gap:8px}
.hd button.sp svg{animation:spn .7s linear}@keyframes spn{to{transform:rotate(360deg)}}
.tabs{display:flex;justify-content:center;gap:28px;background:#fff;padding:6px 0 0}
.tabs button{background:none;border:0;font-size:15px;color:var(--muted);padding:10px 4px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.btn{display:block;width:100%;padding:13px;font-size:16px;font-weight:700;color:#fff;background:var(--brand);border:0;border-radius:10px;cursor:pointer;text-align:center;text-decoration:none}
.btn.alt{background:#eef1f8;color:var(--ink);font-weight:600}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:end;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px}
nav a .i{height:26px;display:flex;align-items:center}
nav a.on{color:var(--brand);font-weight:700}
nav .scan{position:relative}
nav .scan a{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:62px;height:62px;filter:drop-shadow(0 4px 8px rgba(10,92,255,.35))}
nav .scan img{width:100%;height:100%;display:block}

.pg{padding:14px 14px 100px}
.dl{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.dl a{color:var(--brand);font-weight:600;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl button{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:#eef3ff;border:0;border-radius:8px;cursor:pointer;color:var(--brand)}
.dl button svg{width:18px;height:18px;display:block}
.dl .ld{flex:none;color:var(--brand);display:flex}.dl .ld svg{width:20px;height:20px}
.cam{width:230px;height:230px;margin:26px auto 14px;background:linear-gradient(145deg,#eef3ff,#dfe8fb);border-radius:18px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--brand);box-shadow:inset 0 0 0 1px #d3def5}
.cn{position:absolute;width:30px;height:30px;border:4px solid var(--brand);z-index:3;pointer-events:none}
.cn.tl{top:12px;left:12px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.cn.tr{top:12px;right:12px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.cn.bl{bottom:12px;left:12px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.cn.br{bottom:12px;right:12px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.cam.live .cn{border-color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cam.live::after{content:"";z-index:2;position:absolute;left:8%;right:8%;height:2px;background:var(--brand);box-shadow:0 0 8px var(--brand);animation:sc 2s linear infinite}
@keyframes sc{0%{top:10%}50%{top:90%}100%{top:10%}}
.cap{text-align:center;font-size:14px;color:var(--muted);min-height:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.row .btn{padding:15px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px;font-size:16px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.note{font-size:13px;margin-top:12px;min-height:18px;text-align:center}
.pane{display:none}.pane.on{display:block}
</style></head><body><div class="app">

</div>

<script>
const $=id=>document.getElementById(id),nt=$('nt'),msg=(t,ok)=>{nt.style.color=ok?'#1b8a4b':'#c62828';nt.textContent=t};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on');nt.textContent='';stop()});
$('cp').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText('https://instantpay.app/download'):Promise.reject()).then(()=>msg('Link copied',1)).catch(()=>msg('Copy not supported',0))};
let stream,timer,result='';
function stop(){clearInterval(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('cam').classList.remove('live');const v=$('cam').querySelector('video');if(v)v.remove()}
$('sb').onclick=async()=>{
 if(stream){stop();return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  const v=document.createElement('video');v.srcObject=stream;v.setAttribute('playsinline','');v.muted=true;await v.play();
  $('cam').appendChild(v);$('cam').classList.add('live');$('cap').textContent='Point the camera at the QR code';
  if('BarcodeDetector' in window){const d=new BarcodeDetector({formats:['qr_code']});
   timer=setInterval(async()=>{try{const r=await d.detect(v);if(r.length){result=r[0].rawValue;stop();$('cap').textContent='Scanned: '+result;msg('QR scanned. Tap Submit.',1)}}catch(e){}},500)}
  else msg('Auto-scan not supported in this browser.',0);
 }catch(e){msg('Camera permission denied or unavailable.',0)}
};
$('sub').onclick=()=>{if(!result)return msg('Please scan a QR code first.',0);/* TODO: send to backend */msg('Payment request submitted. (Demo - connect backend.)',1)};
$('am').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');
$('tb').onclick=()=>{if(!$('to').value.trim()||!+$('am').value)return msg('Enter receiver and a valid amount.',0);/* TODO: backend */msg('Transfer request submitted. (Demo - connect backend.)',1)};
window.addEventListener('pagehide',stop);
</script></body></html>
