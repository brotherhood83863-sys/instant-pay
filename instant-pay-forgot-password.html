<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a5cff">
<title>Instant Pay - Reset Password</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#12203a;--muted:#5b6a85;--line:#d5dcea;--brand:#0a5cff;--brand2:#0838a8;--err:#c62828;--ok:#1b8a4b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:linear-gradient(120deg,#0a5cff,#0838a8);color:#fff;text-align:center;padding:24px 16px}header h1{margin:0;font-size:29px;letter-spacing:.3px;font-weight:800}header p{margin:5px 0 0;font-size:14px;opacity:.92}
main{width:100%;max-width:440px;padding:24px 16px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 32px #142b5010}
.mark{width:54px;height:54px;border-radius:16px;background:#eaf1ff;color:var(--brand);display:grid;place-items:center;margin-bottom:16px}.mark svg{width:28px;height:28px}h2{margin:0 0 7px;font-size:22px}.sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.55}
label{display:block;font-size:14px;font-weight:650;margin:15px 0 7px}.field{position:relative}.prefix{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;color:var(--ink);background:#fff}input.p{padding-left:48px}input:focus{outline:3px solid #0a5cff25;border-color:var(--brand)}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:7px;display:flex;align-items:center;justify-content:center;border-radius:7px}.toggle svg{width:20px;height:20px}.field input[type=password],.field input[type=text]{padding-right:48px}
.msg{font-size:12.5px;color:var(--err);min-height:16px;margin-top:5px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}button.submit{width:100%;margin-top:15px;padding:14px;font-size:16px;font-weight:750;color:#fff;background:var(--brand);border:0;border-radius:10px;cursor:pointer}button.submit:hover{background:var(--brand2)}button:disabled{opacity:.55;cursor:not-allowed}button#sendOtp{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--brand);font-weight:750;font-size:13px;cursor:pointer;padding:8px 4px;white-space:nowrap} .otp-field input{padding-right:100px!important}.foot{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}a{color:var(--brand);font-weight:650;text-decoration:none}.success{display:none;text-align:center;padding:12px 0}.success strong{color:var(--ok);font-size:20px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<header><h1>Instant Pay</h1><p>Account recovery</p></header>
<main><section class="card">
<div id="formBox">
<div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
<h2>Reset your password</h2><p class="sub">Enter your registered mobile number, verify the OTP, and set a new password.</p>
<form id="f" novalidate>
<label for="mobile">Registered mobile number</label><div class="field"><span class="prefix">+91</span><input class="p" id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel-national"></div><div class="msg" id="mErr"></div>
<label for="otp">OTP verification code</label>
<div class="field otp-field"><input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" autocomplete="one-time-code"><button id="sendOtp" type="button">Get OTP</button></div>
<div class="msg" id="otpErr"></div>
<p class="note" id="timer" aria-live="polite"></p>
<label for="pw">Reset password</label><div class="field"><input id="pw" type="password" minlength="6" placeholder="At least 6 characters" autocomplete="new-password"><button type="button" class="toggle" id="tg1" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="msg" id="pErr"></div>
<label for="cpw">Confirm new password</label><div class="field"><input id="cpw" type="password" placeholder="Re-enter new password" autocomplete="new-password"><button type="button" class="toggle" id="tg2" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="msg" id="cErr"></div>
<button class="submit" type="submit">Confirm reset password</button>
</form>

</div>
<div class="success" id="ok"><strong>Password updated</strong><p>Your password has been changed.</p><a href="instant-pay-login.html">Return to login</a></div>
</section><div class="foot"><a href="instant-pay-login.html">← Back to login</a></div></main>
<script>
const $=id=>document.getElementById(id);
$('mobile').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,''));
function toggle(btn,input){btn.onclick=()=>{const show=input.type==='password';input.type=show?'text':'password';btn.innerHTML=show?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.3 3.3-.7"/></svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`;btn.setAttribute('aria-label',show?'Hide password':'Show password');btn.title=show?'Hide password':'Show password';}}
toggle($('tg1'),$('pw'));toggle($('tg2'),$('cpw'));
async function hashPw(m,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('instantpay:'+m+':'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
let countdown=null, secondsLeft=0, otpRequested=false;
$('sendOtp').addEventListener('click',async()=>{
 const m=$('mobile').value;
 $('mErr').textContent=/^[6-9]\d{9}$/.test(m)?'':'Enter a valid 10-digit mobile number.';
 if(!/^[6-9]\d{9}$/.test(m)) return;
 // TODO: Connect your real backend SMS OTP endpoint here.
 // Example: await fetch('/api/otp/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mobile:m})});
 // Never generate or display a real OTP in frontend/browser code.
 otpRequested=true;
 $('otpErr').textContent='';
 $('otp').value='';
 $('sendOtp').disabled=true;
 secondsLeft=60;
 $('sendOtp').textContent='60s';
 $('timer').textContent='If SMS OTP service is connected, enter the code sent to your mobile.';
 clearInterval(countdown);
 countdown=setInterval(()=>{
   secondsLeft--;
   if(secondsLeft<=0){clearInterval(countdown);$('timer').textContent='You can request a new OTP now.';$('sendOtp').disabled=false;$('sendOtp').textContent='Resend';}
   else $('sendOtp').textContent=secondsLeft+'s';
 },1000);
});
$('otp').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);otpVerified=false;});
$('f').addEventListener('submit',async e=>{
 e.preventDefault();
 const m=$('mobile').value,p=$('pw').value,c=$('cpw').value;let bad=false;
 $('mErr').textContent=/^[6-9]\d{9}$/.test(m)?'':(bad=true,'Enter a valid 10-digit mobile number.');
 $('otpErr').textContent='Real OTP verification API is not connected yet. Add your backend OTP verification here.';
 if(!otpRequested) bad=true;
 // TODO: Verify the entered OTP with your secure backend before changing the password.
 // Do not verify OTPs or reset account passwords using frontend-only/localStorage logic.
 $('pErr').textContent=p.length>=6?'':(bad=true,'Password must be at least 6 characters.');
 $('cErr').textContent=c&&c===p?'':(bad=true,'Passwords do not match.');
 if(bad)return;
});
</script>
</body></html>
