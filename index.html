<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title><span style="color:#1683ff;">Instant</span> <span style="color:#ffd21f;">Pay</span> Registration</title><style>
body{font-family:Arial;background:#f5f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(420px,92%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0001}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px}input{border:1px solid #ddd}button{border:0;background:#2563eb;color:white;font-weight:700}#msg{margin-top:10px}
</style></head><body><div class="card"><h1><span style="color:#1683ff;">Instant</span> <span style="color:#ffd21f;">Pay</span></h1><p>Member Registration</p>
<form id="regForm"><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Mobile number" required>
<input id="password" type="password" minlength="6" placeholder="Password (min 6)" required>
<input id="confirm" type="password" minlength="6" placeholder="Confirm password" required>
<input id="invite" value="JUDG97HF8" readonly placeholder="Invite code"><button id="submitBtn">Register</button>


</form>
<div id="msg"></div>
<div style="margin:14px 0;font-size:14px;">
  <label>
    <input type="checkbox" id="termsCheck" required>
    I agree to the <a href="#" onclick="alert('Please review the Terms & Conditions before registering.'); return false;">Terms & Conditions</a>
  </label>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,setDoc,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAbKTcIyuPIQUT066jCv4aLM2uGil2mYic",
  authDomain: "instantpay-f6830.firebaseapp.com",
  projectId: "instantpay-f6830",
  storageBucket: "instantpay-f6830.firebasestorage.app",
  messagingSenderId: "138175777245",
  appId: "1:138175777245:web:b04a8914d9189dbec88e34",
  measurementId: "G-3YCDT98JE2"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
$("invite").value=new URLSearchParams(location.search).get("invite")||"HJ886GI85";
$("regForm").onsubmit=async e=>{e.preventDefault();const mobile=$("mobile").value.trim(),pass=$("password").value,confirm=$("confirm").value,msg=$("msg"),btn=$("submitBtn");
if(!/^\d{10}$/.test(mobile))return msg.textContent="10 digit mobile number डालें.";
if(pass!==confirm)return msg.textContent="Passwords match नहीं हैं.";
if(pass.length<6)return msg.textContent="Password कम से कम 6 characters का होना चाहिए.";
btn.disabled=true;msg.textContent="Register हो रहा है...";
try{const c=await createUserWithEmailAndPassword(auth,mobile+"@instantpay-demo.local",pass),reward=Math.floor(Math.random()*43)+68;
await setDoc(doc(db,"members",c.user.uid),{uid:c.user.uid,mobile,inviteCode:$("invite").value.trim(),demoBalance:reward,registrationReward:reward,createdAt:serverTimestamp(),status:"active"});
await addDoc(collection(db,"notifications"),{type:"registration",memberId:c.user.uid,mobile,message:"New member registered: "+mobile,reward,read:false,createdAt:serverTimestamp()});
msg.textContent="Registration successful. Demo reward: ₹"+reward;setTimeout(()=>location.href="instant-pay-test-member.html",900);
}catch(err){msg.textContent=err.code==="auth/email-already-in-use"?"Ye mobile pehle se registered hai.":err.message}finally{btn.disabled=false}};
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector("form");
  const terms = document.getElementById("termsCheck");
  if (form && terms) {
    form.addEventListener("submit", function (e) {
      if (!terms.checked) {
        e.preventDefault();
        alert("Please agree to the Terms & Conditions first.");
      }
    });
  }
});
</script>

</body></html>
