<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Pay - Member Login</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#12203a;--muted:#5b6a85;--line:#d5dcea;--brand:#0a5cff;--brand2:#0838a8;--err:#c62828;--ok:#1b8a4b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:var(--brand);color:#fff;text-align:center;padding:22px 16px}
header h1{margin:0;font-size:30px;letter-spacing:.5px;font-weight:800}
header p{margin:4px 0 0;font-size:14px;opacity:.9}
main{width:100%;max-width:420px;padding:22px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h2{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.field{position:relative}
.prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
input[type=tel],input[type=password],input[type=text]{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:9px;background:transparent;color:var(--ink)}
input.p{padding-left:48px}
input:focus-visible{outline:3px solid var(--brand);outline-offset:1px;border-color:var(--brand)}

.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:7px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.toggle:hover{background:#edf3ff;color:var(--brand)}
.toggle svg{width:20px;height:20px;display:block}
.field input[type=password],.field input[type=text]{padding-right:48px}

.msg{font-size:12.5px;color:var(--err);min-height:16px;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13.5px}
.row a{color:var(--brand);text-decoration:none;font-weight:600}
button.submit{width:100%;margin-top:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--brand);border:0;border-radius:9px;cursor:pointer}
button.submit:hover{background:var(--brand2)}
button.submit:disabled{opacity:.55;cursor:not-allowed}
.banner{display:none;margin-bottom:14px;padding:10px 12px;border-radius:9px;font-size:13.5px;background:#e8f8ef;color:var(--ok);border:1px solid #bfe6cf}
.banner.on{display:block}
.success{display:none;text-align:center;padding:10px 0}
.success strong{color:var(--ok);font-size:20px;display:block;margin-bottom:6px}
.foot{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.foot a{color:var(--brand)}
</style>
</head>
<body>
<header>
  <h1>Instant Pay</h1>
  <p>Member Login</p>
</header>
<main>
  <div class="card">
    <div id="formBox">
      <div class="banner" id="bn"></div>
      <h2>Welcome back</h2>
      <p class="sub">Login with your mobile number and password.</p>
      <form id="f" novalidate>
        <label for="mobile">Mobile Number</label>
        <div class="field">
          <span class="prefix">+91</span>
          <input class="p" id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel-national">
        </div>
        <div class="msg" id="mErr"></div>

        <label for="pw">Password</label>
        <div class="field">
          <input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle" id="tg" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="msg" id="pErr"></div>

        <div class="row">
          <span></span>
          <a href="instant-pay-forgot-password.html">Forgot password?</a>
        </div>

        <button class="submit" id="go" type="submit">Login</button>
      </form>
    </div>
    <div class="success" id="ok">
      <strong>Login successful!</strong>
      Taking you to Instant Pay.
    </div>
  </div>
  <div class="foot">New member? <a href="instant-pay-register-en.html">Register</a></div>
</main>
<script>
const $ = id => document.getElementById(id);
const HOME = 'instant-pay-home.html';
const ldj = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e) { return d; } };

$('mobile').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, ''));
$('tg').onclick = () => {
  const show = $('pw').type === 'password';
  $('pw').type = show ? 'text' : 'password';
  $('tg').innerHTML = show ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.3 3.3-.7"/></svg>` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`; $('tg').setAttribute('aria-label', show ? 'Hide password' : 'Show password'); $('tg').title = show ? 'Hide password' : 'Show password';
};

async function hashPw(m, p){
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('instantpay:' + m + ':' + p));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch(e) {
    let h = 0; for (const ch of 'instantpay:' + m + ':' + p) h = (h * 31 + ch.charCodeAt(0)) | 0;
    return 'f' + h;
  }
}

// came here from Logout -> stay on login and show a message; already logged in -> go home
(function(){
  const q = new URLSearchParams(location.search);
  if (q.get('logout') === '1' || localStorage.getItem('instantpay_logged_out') === '1') {
    $('bn').textContent = 'You have been logged out.'; $('bn').classList.add('on');
    return;
  }
  if (ldj('instantpay_session', null)) location.replace(HOME);
})();

// too many wrong tries -> wait 60 seconds
const lockLeft = () => Math.max(0, Math.ceil((ldj('instantpay_lock', 0) - Date.now()) / 1000));
let tick;
function lockUI(){
  const s = lockLeft();
  $('go').disabled = s > 0;
  if (s > 0) { $('pErr').textContent = 'Too many attempts. Try again in ' + s + 's.'; clearTimeout(tick); tick = setTimeout(lockUI, 1000); }
  else if ($('pErr').textContent.startsWith('Too many')) $('pErr').textContent = '';
}
lockUI();

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  if (lockLeft() > 0) return lockUI();
  const m = $('mobile').value, p = $('pw').value;
  let bad = false;
  $('mErr').textContent = /^[6-9]\d{9}$/.test(m) ? '' : (bad = true, 'Enter a valid 10-digit mobile number.');
  $('pErr').textContent = p ? '' : (bad = true, 'Enter your password.');
  if (bad) return;

  // Demo check against accounts saved in this browser by the register page.
  // TODO: replace with your backend / API login call. Data to send: { mobile: m, password: p }
  const acc = ldj('instantpay_accounts', {});
  const ok = acc[m] && acc[m].hash === await hashPw(m, p);
  if (!ok) {
    const n = (ldj('instantpay_fails', 0) || 0) + 1;
    try {
      if (n >= 5) { localStorage.setItem('instantpay_lock', String(Date.now() + 60000)); localStorage.setItem('instantpay_fails', '0'); }
      else localStorage.setItem('instantpay_fails', String(n));
    } catch(err) {}
    if (n >= 5) return lockUI();
    $('pErr').textContent = 'Incorrect mobile number or password.';
    return;
  }

  try {
    localStorage.setItem('instantpay_fails', '0');
    localStorage.removeItem('instantpay_logged_out');
    localStorage.setItem('instantpay_session', JSON.stringify({ mobile: m, t: Date.now() }));
    const accountsNow = ldj('instantpay_accounts', {});
    const account = accountsNow[m] || {};
    let profile = account.profile;
    if (!profile || profile.mobile !== m) {
      profile = {name:'Member',uid:'IP'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase(),mobile:m,level:'LV0',verified:false,balance:0,sellBalance:0,wallet:'',createdAt:account.createdAt||Date.now()};
      account.profile = profile;
      accountsNow[m] = account;
      localStorage.setItem('instantpay_accounts', JSON.stringify(accountsNow));
    }
    localStorage.setItem('instantpay_user', JSON.stringify(profile));
  } catch(err) {}

  $('formBox').style.display = 'none';
  $('ok').style.display = 'block';
  setTimeout(() => { location.href = HOME; }, 900);
});
</script>
</body>
</html>
